<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LOGIC-215: Combinatorial Binary Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #fafafa;
      color: #18181b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title-block h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #09090b;
      letter-spacing: -0.02em;
    }
    .title-block p {
      font-size: 0.7rem;
      color: #71717a;
    }
    .metrics {
      display: flex;
      gap: 10px;
    }
    .metric-card {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 4px 10px;
      text-align: center;
      min-width: 75px;
    }
    .metric-label {
      font-size: 0.58rem;
      color: #71717a;
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      color: #09090b;
      font-variant-numeric: tabular-nums;
    }
    .controls-strip {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.75rem;
    }
    .mode-select {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #27272a;
      outline: none;
    }
    .btn {
      background: #18181b;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #27272a; }
    .board-container {
      position: relative;
      background: #1e293b;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(7, 54px);
      grid-template-rows: repeat(6, 54px);
      gap: 8px;
    }
    .cell {
      position: relative;
      width: 54px;
      height: 54px;
      background: #0f172a;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .cell.p1 {
      background: radial-gradient(circle at 35% 35%, #f43f5e, #be123c);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
    }
    .cell.p2 {
      background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
    }
    .cell.winning {
      animation: pulseWin 0.8s infinite alternate;
      border: 3px solid #38bdf8;
    }
    @keyframes pulseWin {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.08); }
    }
    .turn-indicator {
      margin-top: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title-block">
      <h1>LOGIC-215: Combinatorial Vertical Matrix</h1>
      <p>Algorithmic Logic · Discrete Alignment Game Theory</p>
    </div>
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Scholar (P1)</div>
        <div class="metric-val" id="p1Wins">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Faculty (P2)</div>
        <div class="metric-val" id="p2Wins">0</div>
      </div>
    </div>
  </div>

  <div class="controls-strip">
    <div>
      <label for="mode" style="color: #71717a; margin-right: 6px;">Adversary Model:</label>
      <select id="mode" class="mode-select">
        <option value="ai">Autonomous Scholar AI (Minimax)</option>
        <option value="pvp">Local Two-Peer Colloquium</option>
      </select>
    </div>
    <button class="btn" id="resetBtn">Reset Matrix</button>
  </div>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="turn-indicator" id="turnIndicator">
    <span class="turn-dot" id="turnDot" style="background: #f43f5e;"></span>
    <span id="turnText">Scholar Node (P1) Ready for Input</span>
  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let currentPlayer = 1; // 1 = Red (Scholar), 2 = Amber (Faculty)
    let isGameOver = false;
    let p1WinCount = 0;
    let p2WinCount = 0;

    const boardEl = document.getElementById('board');
    const turnText = document.getElementById('turnText');
    const turnDot = document.getElementById('turnDot');
    const modeSelect = document.getElementById('mode');
    const resetBtn = document.getElementById('resetBtn');
    const p1WinsEl = document.getElementById('p1Wins');
    const p2WinsEl = document.getElementById('p2Wins');

    let audioCtx = null;
    function playBeep(freq, type='sine', dur=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (grid[r][c] === 1) cell.classList.add('p1');
          else if (grid[r][c] === 2) cell.classList.add('p2');
          cell.dataset.col = c;
          cell.dataset.row = r;
          cell.addEventListener('click', () => handleColumnClick(c));
          boardEl.appendChild(cell);
        }
      }
    }

    function handleColumnClick(col) {
      if (isGameOver) return;
      if (modeSelect.value === 'ai' && currentPlayer === 2) return;

      if (dropToken(col, currentPlayer)) {
        playBeep(260 + (6 - getLowestEmptyRow(col)) * 40, 'triangle', 0.1);
        const win = checkWin(grid);
        if (win) {
          highlightWin(win);
          isGameOver = true;
          if (currentPlayer === 1) {
            p1WinCount++;
            p1WinsEl.textContent = p1WinCount;
            turnText.textContent = 'Scholar (P1) Synthesized 4-Tensor Alignment!';
          } else {
            p2WinCount++;
            p2WinsEl.textContent = p2WinCount;
            turnText.textContent = 'Faculty (P2) Synthesized 4-Tensor Alignment!';
          }
          playBeep(620, 'sine', 0.3);
          return;
        }

        if (isBoardFull()) {
          isGameOver = true;
          turnText.textContent = 'Orthogonal Matrix Saturated (Stalemate)';
          return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        updateTurnDisplay();

        if (modeSelect.value === 'ai' && currentPlayer === 2 && !isGameOver) {
          setTimeout(aiMove, 350);
        }
      }
    }

    function getLowestEmptyRow(col, g = grid) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (g[r][col] === 0) return r;
      }
      return -1;
    }

    function dropToken(col, player, g = grid) {
      const r = getLowestEmptyRow(col, g);
      if (r === -1) return false;
      g[r][col] = player;
      renderBoard();
      return true;
    }

    function updateTurnDisplay() {
      if (currentPlayer === 1) {
        turnDot.style.background = '#f43f5e';
        turnText.textContent = 'Scholar Node (P1) Ready for Input';
      } else {
        turnDot.style.background = '#fbbf24';
        turnText.textContent = modeSelect.value === 'ai' ? 'Faculty Minimax AI Calculating...' : 'Colleague Node (P2) Input';
      }
    }

    function isBoardFull() {
      return grid[0].every(cell => cell !== 0);
    }

    function checkWin(g) {
      // Horizontal
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          const p = g[r][c];
          if (p !== 0 && p === g[r][c+1] && p === g[r][c+2] && p === g[r][c+3]) {
            return [[r,c],[r,c+1],[r,c+2],[r,c+3]];
          }
        }
      }
      // Vertical
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          const p = g[r][c];
          if (p !== 0 && p === g[r+1][c] && p === g[r+2][c] && p === g[r+3][c]) {
            return [[r,c],[r+1,c],[r+2,c],[r+3,c]];
          }
        }
      }
      // Positive Diagonal
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          const p = g[r][c];
          if (p !== 0 && p === g[r-1][c+1] && p === g[r-2][c+2] && p === g[r-3][c+3]) {
            return [[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]];
          }
        }
      }
      // Negative Diagonal
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          const p = g[r][c];
          if (p !== 0 && p === g[r+1][c+1] && p === g[r+2][c+2] && p === g[r+3][c+3]) {
            return [[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
          }
        }
      }
      return null;
    }

    function highlightWin(coords) {
      renderBoard();
      for (const [r, c] of coords) {
        const index = r * COLS + c;
        if (boardEl.children[index]) {
          boardEl.children[index].classList.add('winning');
        }
      }
    }

    // AI Minimax logic with heuristic
    function aiMove() {
      let bestScore = -Infinity;
      let bestCol = 3; // default center

      // 1. Can AI win immediately?
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmptyRow(c);
        if (r !== -1) {
          grid[r][c] = 2;
          if (checkWin(grid)) {
            grid[r][c] = 0;
            executeAiDrop(c);
            return;
          }
          grid[r][c] = 0;
        }
      }

      // 2. Can Player 1 win immediately? Block!
      for (let c = 0; c < COLS; c++) {
        const r = getLowestEmptyRow(c);
        if (r !== -1) {
          grid[r][c] = 1;
          if (checkWin(grid)) {
            grid[r][c] = 0;
            executeAiDrop(c);
            return;
          }
          grid[r][c] = 0;
        }
      }

      // 3. Score preferred columns (center preference)
      const colOrder = [3, 2, 4, 1, 5, 0, 6];
      for (const c of colOrder) {
        const r = getLowestEmptyRow(c);
        if (r !== -1) {
          grid[r][c] = 2;
          let score = evaluatePosition(grid);
          grid[r][c] = 0;
          if (score > bestScore) {
            bestScore = score;
            bestCol = c;
          }
        }
      }

      executeAiDrop(bestCol);
    }

    function evaluatePosition(g) {
      let score = 0;
      // Center column advantage
      for (let r = 0; r < ROWS; r++) {
        if (g[r][3] === 2) score += 3;
        else if (g[r][3] === 1) score -= 3;
      }
      return score;
    }

    function executeAiDrop(col) {
      dropToken(col, 2);
      playBeep(320, 'triangle', 0.1);
      const win = checkWin(grid);
      if (win) {
        highlightWin(win);
        isGameOver = true;
        p2WinCount++;
        p2WinsEl.textContent = p2WinCount;
        turnText.textContent = 'Faculty (P2) Synthesized 4-Tensor Alignment!';
        playBeep(220, 'sawtooth', 0.3);
        return;
      }
      if (isBoardFull()) {
        isGameOver = true;
        turnText.textContent = 'Orthogonal Matrix Saturated (Stalemate)';
        return;
      }
      currentPlayer = 1;
      updateTurnDisplay();
    }

    function resetGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      currentPlayer = 1;
      isGameOver = false;
      updateTurnDisplay();
      renderBoard();
    }

    resetBtn.addEventListener('click', resetGame);
    modeSelect.addEventListener('change', resetGame);

    resetGame();
  </script>
</body>
</html>
