<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MATH-2048: Binary Matrix Reduction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #fafafa;
      color: #18181b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .hud {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-block h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #09090b;
    }
    .title-block p {
      font-size: 0.75rem;
      color: #71717a;
    }
    .metrics {
      display: flex;
      gap: 8px;
    }
    .metric-card {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      min-width: 70px;
    }
    .metric-label {
      font-size: 0.65rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      color: #18181b;
      font-variant-numeric: tabular-nums;
    }
    .controls-strip {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn {
      background: #18181b;
      color: #fafafa;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #27272a; }
    .btn-secondary {
      background: #f4f4f5;
      color: #18181b;
      border: 1px solid #e4e4e7;
    }
    .btn-secondary:hover { background: #e4e4e7; }
    .instructions {
      font-size: 0.72rem;
      color: #71717a;
    }
    .matrix-board {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      background: #e4e4e7;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      position: relative;
    }
    .cell {
      background: #f4f4f5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #18181b;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .cell[data-val="2"] { background: #ffffff; color: #27272a; }
    .cell[data-val="4"] { background: #fef08a; color: #713f12; }
    .cell[data-val="8"] { background: #fed7aa; color: #7c2d12; }
    .cell[data-val="16"] { background: #fdba74; color: #431407; }
    .cell[data-val="32"] { background: #fb923c; color: #ffffff; }
    .cell[data-val="64"] { background: #f97316; color: #ffffff; }
    .cell[data-val="128"] { background: #e0e7ff; color: #3730a3; font-size: 1.3rem; }
    .cell[data-val="256"] { background: #c7d2fe; color: #312e81; font-size: 1.3rem; }
    .cell[data-val="512"] { background: #a5b4fc; color: #1e1b4b; font-size: 1.3rem; }
    .cell[data-val="1024"] { background: #818cf8; color: #ffffff; font-size: 1.1rem; }
    .cell[data-val="2048"] { background: #4f46e5; color: #ffffff; font-size: 1.1rem; box-shadow: 0 0 12px rgba(79, 70, 229, 0.4); }
    .cell[data-val="4096"] { background: #09090b; color: #ffffff; font-size: 1.1rem; }
    
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(250, 250, 250, 0.92);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .overlay h2 { font-size: 1.25rem; font-weight: 700; color: #09090b; }
    .overlay p { font-size: 0.85rem; color: #52525b; text-align: center; max-width: 280px; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title-block">
      <h1>MATH-2048: Binary Matrix</h1>
      <p>Orthogonal Tensor Consolidation</p>
    </div>
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Credit Index</div>
        <div class="metric-val" id="score">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Honor Record</div>
        <div class="metric-val" id="highScore">0</div>
      </div>
    </div>
  </div>

  <div class="controls-strip">
    <div class="instructions">Directives: Arrow Keys / WASD / Swipe</div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-secondary" id="undoBtn">Step Rollback</button>
      <button class="btn" id="restartBtn">Reinitialize</button>
    </div>
  </div>

  <div class="matrix-board" id="board">
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Practicum Concluded</h2>
      <p id="overlayDesc">Coordinate matrix boundary exhausted. Reinitialize to resume study.</p>
      <button class="btn" id="overlayRestartBtn">Begin New Practicum</button>
    </div>
  </div>

  <script>
    const SIZE = 4;
    let grid = [];
    let prevGrid = null;
    let score = 0;
    let prevScore = 0;
    let highScore = parseInt(localStorage.getItem('scholastica_math2048_record') || '0', 10);
    document.getElementById('highScore').textContent = highScore;

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');

    // Create 16 cells
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      cells[r] = [];
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardEl.appendChild(cell);
        cells[r][c] = cell;
      }
    }

    function init() {
      grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
      score = 0;
      prevGrid = null;
      prevScore = 0;
      updateScore(0);
      spawnTile();
      spawnTile();
      render();
      overlay.classList.remove('active');
    }

    function spawnTile() {
      const empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = grid[r][c];
          const el = cells[r][c];
          el.textContent = val > 0 ? val : '';
          el.setAttribute('data-val', val > 0 ? val : '');
        }
      }
    }

    function updateScore(delta) {
      score += delta;
      scoreEl.textContent = score;
      if (score > highScore) {
        highScore = score;
        document.getElementById('highScore').textContent = highScore;
        localStorage.setItem('scholastica_math2048_record', highScore.toString());
      }
    }

    function saveState() {
      prevGrid = grid.map(row => [...row]);
      prevScore = score;
    }

    function undo() {
      if (!prevGrid) return;
      grid = prevGrid.map(row => [...row]);
      score = prevScore;
      scoreEl.textContent = score;
      prevGrid = null;
      overlay.classList.remove('active');
      render();
    }

    function slideRow(row) {
      let arr = row.filter(x => x !== 0);
      let gained = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          gained += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(x => x !== 0);
      while (arr.length < SIZE) arr.push(0);
      return { arr, gained };
    }

    function move(dir) {
      saveState();
      let moved = false;
      let totalGained = 0;

      if (dir === 'left') {
        for (let r = 0; r < SIZE; r++) {
          const res = slideRow(grid[r]);
          if (res.arr.some((val, idx) => val !== grid[r][idx])) moved = true;
          grid[r] = res.arr;
          totalGained += res.gained;
        }
      } else if (dir === 'right') {
        for (let r = 0; r < SIZE; r++) {
          const res = slideRow([...grid[r]].reverse());
          res.arr.reverse();
          if (res.arr.some((val, idx) => val !== grid[r][idx])) moved = true;
          grid[r] = res.arr;
          totalGained += res.gained;
        }
      } else if (dir === 'up') {
        for (let c = 0; c < SIZE; c++) {
          const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          const res = slideRow(col);
          for (let r = 0; r < SIZE; r++) {
            if (grid[r][c] !== res.arr[r]) moved = true;
            grid[r][c] = res.arr[r];
          }
          totalGained += res.gained;
        }
      } else if (dir === 'down') {
        for (let c = 0; c < SIZE; c++) {
          const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          const res = slideRow(col);
          for (let r = 0; r < SIZE; r++) {
            if (grid[3 - r][c] !== res.arr[r]) moved = true;
            grid[3 - r][c] = res.arr[r];
          }
          totalGained += res.gained;
        }
      }

      if (moved) {
        updateScore(totalGained);
        spawnTile();
        render();
        checkStatus();
      }
    }

    function checkStatus() {
      // Check 2048 win
      let has2048 = false;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 2048) has2048 = true;
        }
      }
      if (has2048 && !overlay.classList.contains('active')) {
        overlayTitle.textContent = "Honors Objective Attained!";
        overlayDesc.textContent = "2,048 Binary Consolidation synthesized. Continue advancing or reinitialize.";
        overlay.classList.add('active');
        return;
      }

      // Check available moves
      let movesAvailable = false;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) movesAvailable = true;
          if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) movesAvailable = true;
          if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) movesAvailable = true;
        }
      }
      if (!movesAvailable) {
        overlayTitle.textContent = "Practicum Concluded";
        overlayDesc.textContent = "Coordinate matrix capacity reached. Final Accumulated Index: " + score;
        overlay.classList.add('active');
      }
    }

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': move('left'); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': move('right'); e.preventDefault(); break;
        case 'ArrowUp': case 'w': case 'W': move('up'); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': move('down'); e.preventDefault(); break;
      }
    });

    // Touch swipe support
    let touchStartX = 0, touchStartY = 0;
    boardEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }
    });

    document.getElementById('restartBtn').addEventListener('click', init);
    document.getElementById('overlayRestartBtn').addEventListener('click', init);
    document.getElementById('undoBtn').addEventListener('click', undo);

    init();
  </script>
</body>
</html>
