    <script>
      // Safe Storage Wrapper (prevents SecurityError inside opaque/null blob: origins)
      const memoryStorage = Object.create(null);
      const safeStorage = {
        get(key, fallback) {
          try {
            const val = window.localStorage.getItem(key);
            if (val !== null) {
              memoryStorage[key] = val;
              return val;
            }
          } catch (e) {}
          return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : fallback;
        },
        set(key, val) {
          const strVal = String(val);
          memoryStorage[key] = strVal;
          try {
            window.localStorage.setItem(key, strVal);
          } catch (e) {}
        },
        remove(key) {
          delete memoryStorage[key];
          try {
            window.localStorage.removeItem(key);
          } catch (e) {}
        },
        all() {
          try {
            return { ...window.localStorage };
          } catch (e) {
            return { ...memoryStorage };
          }
        }
      };

      const STORAGE_KEYS = {
        favs: 'gn_portal_favorites',
        theme: 'gn_portal_theme_v2',

      function toTitleCase(str) {
        return str.replace(/\w\S*/g, text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase());
      }

      function hexToRgb(hex) {
        const clean = hex.replace('#', '');
        const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean;
        const num = parseInt(full, 16);
        if (Number.isNaN(num)) return { r: 52, g: 211, b: 153 };
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
      }

      function setAccentColor(hex) {
        const normalized = /^#[0-9a-f]{6}$/i.test(hex) ? hex.toLowerCase() : (THEME_DEFAULTS[currentTheme] || '#34d399');
        const { r, g, b } = hexToRgb(normalized);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const contrast = luminance > 0.62 ? '#09111a' : '#ffffff';
        const root = document.documentElement;
        root.style.setProperty('--accent', normalized);
        root.style.setProperty('--accent-hover', normalized);
        root.style.setProperty('--accent-soft', `rgba(${r}, ${g}, ${b}, 0.15)`);
        root.style.setProperty('--accent-contrast', contrast);
        const picker = document.getElementById('accent-color-picker');
        const label = document.getElementById('accent-hex-label');
        if (picker) picker.value = normalized;
        if (label) label.textContent = normalized;
        safeStorage.set(STORAGE_KEYS.accent, normalized);
      }

      function setTheme(themeName, resetAccent) {
        currentTheme = THEME_DEFAULTS[themeName] ? themeName : 'midnight';
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.querySelectorAll('[data-theme-preset]').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-theme-preset') === currentTheme);
        });
        safeStorage.set(STORAGE_KEYS.theme, currentTheme);
        if (resetAccent) {
          setAccentColor(THEME_DEFAULTS[currentTheme]);
        }
      }

      function setFont(fontKey) {
        const key = FONT_STACKS[fontKey] ? fontKey : 'sans';
        document.documentElement.style.setProperty('--font-ui', FONT_STACKS[key]);
        const sel = document.getElementById('font-family-select');
        if (sel) sel.value = key;
        safeStorage.set(STORAGE_KEYS.font, key);
      }

      function applyCloak(title, iconUrl) {
        const nextTitle = (title || '').trim() || 'Dashboard';
        const nextIcon = (iconUrl || '').trim() || DEFAULT_FAVICON;
        document.title = nextTitle;
        const link = document.getElementById('dynamic-favicon') || document.querySelector("link[rel~='icon']");
        if (link) link.href = nextIcon;
        const titleInput = document.getElementById('cloak-title-input');
        const iconInput = document.getElementById('cloak-icon-input');
        if (titleInput && titleInput.value !== nextTitle) titleInput.value = nextTitle;
        if (iconInput) {
          iconInput.value = (iconUrl && !iconUrl.startsWith('data:')) ? iconUrl : '';
        }
        safeStorage.set(STORAGE_KEYS.cloakTitle, nextTitle);

      /* ---------------- GAMES & LINKS ---------------- */
      function ensureBaseHref(rawHtml, baseHref) {
        if (/<base\b[^>]*href=/i.test(rawHtml)) return rawHtml;
        if (/<head\b[^>]*>/i.test(rawHtml)) {
          return rawHtml.replace(/(<head\b[^>]*>)/i, '$1<base href="' + baseHref + '">');
        }
        return '<base href="' + baseHref + '">' + rawHtml;
      }

      function getFpsUnlockTag() {
        const scriptCode = `(function(){
          if(window.__gnFpsUnlocked)return;
          window.__gnFpsUnlocked=true;
          var nativeGetContext=HTMLCanvasElement.prototype.getContext;
          HTMLCanvasElement.prototype.getContext=function(type,attrs){
            if(type==="webgl"||type==="webgl2"||type==="experimental-webgl"){
              var nextAttrs=Object.assign({},attrs||{},{powerPreference:"high-performance"});
              return nativeGetContext.call(this,type,nextAttrs);
            }
            return nativeGetContext.call(this,type,attrs);
          };
          try{
            Object.defineProperty(document,"hidden",{configurable:true,get:function(){return false;}});
            Object.defineProperty(document,"visibilityState",{configurable:true,get:function(){return "visible";}});
          }catch(e){}
          var nativeSetTimeout=window.setTimeout.bind(window);
          var nativeClearTimeout=window.clearTimeout.bind(window);
          var nativeSetInterval=window.setInterval.bind(window);
          var channel=typeof MessageChannel!=="undefined"?new MessageChannel():null;
          var rafQueue=new Map();
          var nextRafId=1;
          var pumpScheduled=false;
          var lastPaintYield=performance.now();
          function schedulePump(){
            if(pumpScheduled)return;
            pumpScheduled=true;
            var now=performance.now();
            if(channel&&(now-lastPaintYield)<8){
              channel.port2.postMessage(null);
            }else{
              lastPaintYield=now;
              nativeSetTimeout(flushRaf,0);
            }
          }
          function flushRaf(){
            pumpScheduled=false;
            if(rafQueue.size===0)return;
            var batch=rafQueue;
            rafQueue=new Map();
            var ts=performance.now();
            batch.forEach(function(cb){
              try{cb(ts);}catch(err){nativeSetTimeout(function(){throw err;},0);}
            });
            if(rafQueue.size>0){schedulePump();}
          }
          if(channel){channel.port1.onmessage=flushRaf;}
          window.requestAnimationFrame=function(cb){
            if(typeof cb!=="function")return 0;
            var id=nextRafId++;
            rafQueue.set(id,cb);
            schedulePump();
            return id;
          };
          window.cancelAnimationFrame=function(id){rafQueue.delete(id);};
          var customTimers=new Map();
          var nextCustomTimerId=900000000;
          window.setTimeout=function(fn,delay){
            var args=Array.prototype.slice.call(arguments,2);
            if(typeof delay==="number"&&delay>=12&&delay<=45&&typeof fn==="function"){
              var tid=nextCustomTimerId++;
              var entry={cancelled:false};
              customTimers.set(tid,entry);
              window.requestAnimationFrame(function(){
                if(entry.cancelled)return;
                customTimers.delete(tid);
                fn.apply(window,args);
              });
              return tid;
            }
            return nativeSetTimeout.apply(window,arguments);
          };
          window.clearTimeout=function(id){
            if(customTimers.has(id)){
              customTimers.get(id).cancelled=true;
              customTimers.delete(id);
              return;
            }
            return nativeClearTimeout(id);
          };
          window.setInterval=function(fn,delay){
            if(typeof delay==="number"&&delay>=12&&delay<=45){
              var args=Array.prototype.slice.call(arguments);
              args[1]=1;
              return nativeSetInterval.apply(window,args);
            }
            return nativeSetInterval.apply(window,arguments);
          };
        })();`;
        return '<script data-gn-fps="unlimited">' + scriptCode + '<\/script>';
      }

      function prepareZoneHtml(rawHtml) {
        const html = ensureBaseHref(rawHtml, htmlURL + "/");
        if (!unlimitedFps) return html;
        const fpsTag = getFpsUnlockTag();
        if (/<base\b[^>]*>/i.test(html)) {
          return html.replace(/(<base\b[^>]*>)/i, '$1' + fpsTag);
        }
        if (/<head\b[^>]*>/i.test(html)) {
          return html.replace(/(<head\b[^>]*>)/i, '$1' + fpsTag);
        }
        return fpsTag + html;
      }

      function isFavorite(id) {
        return favorites.indexOf(String(id)) !== -1;
      }

      function toggleFavorite(id) {
        const key = String(id);
        const idx = favorites.indexOf(key);
        if (idx === -1) favorites.push(key);
        else favorites.splice(idx, 1);
        safeStorage.set(STORAGE_KEYS.favs, JSON.stringify(favorites));
        renderActiveList();

      function getFilteredZones() {
        const query = (searchBar.value || '').trim().toLowerCase();
        const tag = filterOptions.value;
        let list = zones.slice();
        if (activeGamesTab === 'featured') list = list.filter(z => Boolean(z.featured));
        else if (activeGamesTab === 'favorites') list = list.filter(z => isFavorite(z.id));
        if (tag && tag !== 'none') list = list.filter(z => Array.isArray(z.special) && z.special.includes(tag));
        if (query) {
          list = list.filter(z =>
            (z.name && z.name.toLowerCase().includes(query)) ||
            (z.author && z.author.toLowerCase().includes(query))
          );
        }
        return list;

      async function listZones() {
        const refreshBtn = document.getElementById('refresh');
        if (refreshBtn) {
          refreshBtn.classList.remove('spinning');
          void refreshBtn.offsetWidth;
          refreshBtn.classList.add('spinning');
        }
        try {
          let sharesponse;
          try {
            sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now());
          } catch (error) {}
          if (sharesponse && sharesponse.status === 200) {
            try {
              const shajson = await sharesponse.json();
              const sha = shajson[0]['sha'];
              if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            } catch (error) {
              try {
                const secRes = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t=" + Date.now());
                if (secRes && secRes.status === 200) {
                  const sha = (await secRes.text()).trim();
                  if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                }
              } catch (err) {}
            }
          }

          const response = await fetch(zonesURL + "?t=" + Date.now());
          const json = await response.json();
          zones = json;
          if (zones.length > 0) zones[0].featured = true;
          await Promise.all([
            fetchPopularity("year"),
            fetchPopularity("month"),
            fetchPopularity("week"),
            fetchPopularity("day")
          ]);
          sortZones();

          let alltags = [];
          for (const obj of json) {
            if (Array.isArray(obj.special)) alltags.push(...obj.special);
          }
          alltags = [...new Set(alltags)];
          while (filterOptions.children.length > 1) {
            filterOptions.removeChild(filterOptions.lastElementChild);
          }
          for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = toTitleCase(tag);
            filterOptions.appendChild(opt);
          }
        } catch (error) {
          zoneCountEl.textContent = 'Offline or unavailable';
          emptyState.textContent = 'Could not load remote catalog while offline. Calculator, Notepad, and Focus Timer remain fully available.';
          emptyState.classList.remove('hidden');
        }
      }

      async function fetchPopularity(duration) {
        try {
          if (!popularityData[duration]) popularityData[duration] = {};
          const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration);
          const data = await response.json();
          data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
              popularityData[duration][parseInt(idMatch[1], 10)] = file.hits?.total ?? 0;
            }
          });
        } catch (error) {
          if (!popularityData[duration]) popularityData[duration] = {};
          popularityData[duration][0] = 0;
        }
      }

      function sortZones() {
        const sortBy = sortOptions.value;
        if (sortBy === 'name') zones.sort((a, b) => a.name.localeCompare(b.name));
        else if (sortBy === 'id') zones.sort((a, b) => a.id - b.id);
        else if (sortBy === 'popular') zones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
        else if (sortBy === 'trendingMonth') zones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
        else if (sortBy === 'trendingWeek') zones.sort((a, b) => ((popularityData['week']?.[b.id]) ?? 0) - ((popularityData['week']?.[a.id]) ?? 0));
        else if (sortBy === 'trendingDay') zones.sort((a, b) => ((popularityData['day']?.[b.id]) ?? 0) - ((popularityData['day']?.[a.id]) ?? 0));
        zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
        renderActiveList();
      }

      function displayZones(zonesList) {
        container.innerHTML = "";
        zoneCountEl.textContent = `${zonesList.length} ${zonesList.length === 1 ? 'title' : 'titles'}`;

        if (zonesList.length === 0) {
          emptyState.textContent = activeGamesTab === 'favorites'
            ? 'No favorited games yet. Click the star on any game cover to pin it here.'

          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');
        const fragment = document.createDocumentFragment();

        zonesList.forEach((file, index) => {
          const card = document.createElement('div');
          card.className = 'zone-card';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.style.animationDelay = Math.min(index, 24) * 16 + 'ms';

          const thumbWrap = document.createElement('div');

          const img = document.createElement('img');
          img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
          img.alt = file.name;
          img.loading = 'lazy';
          img.referrerPolicy = 'no-referrer';
          img.className = 'zone-thumb lazy-zone-img';
          img.onerror = function () { thumbWrap.classList.add('broken'); };

          const fallback = document.createElement('div');
          fallback.className = 'zone-thumb-fallback';
          fallback.textContent = file.name;

          const favActive = isFavorite(file.id);
          const favBtn = document.createElement('button');
          favBtn.type = 'button';
          favBtn.className = 'fav-toggle' + (favActive ? ' active' : '');
          favBtn.setAttribute('aria-label', (favActive ? 'Remove ' : 'Favorite ') + file.name);
          favBtn.title = favActive ? 'Remove from Favorites' : 'Add to Favorites';
          favBtn.textContent = favActive ? '\u2605' : '\u2606';
          favBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            toggleFavorite(file.id);
          });

          thumbWrap.appendChild(img);
          thumbWrap.appendChild(fallback);
          thumbWrap.appendChild(favBtn);

          const body = document.createElement('div');
          body.className = 'zone-card-body';

          const title = document.createElement('h3');
          title.className = 'zone-card-title';
          title.textContent = file.name;
          body.appendChild(title);

          if (file.author || (Array.isArray(file.special) && file.special.length)) {
            const meta = document.createElement('div');
            meta.className = 'zone-card-meta';
            const parts = [];
            if (file.author) parts.push(file.author);
            if (Array.isArray(file.special) && file.special.length) parts.push(toTitleCase(file.special[0]));
            meta.textContent = parts.join(' \u00B7 ');
            body.appendChild(meta);
          }

          card.appendChild(thumbWrap);
          card.appendChild(body);
          card.addEventListener('click', () => openZone(file));
          card.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' || ev.key === ' ') {
              ev.preventDefault();
              openZone(file);
            }
          });
          fragment.appendChild(card);
        });

        container.appendChild(fragment);

        const lazyImages = container.querySelectorAll('img.lazy-zone-img');
        const imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !viewerOpen) {
              const img = entry.target;
              img.src = img.dataset.src;
              img.classList.remove("lazy-zone-img");
              observer.unobserve(img);
            }
          });
        }, { rootMargin: "150px", threshold: 0.05 });

        lazyImages.forEach(img => imageObserver.observe(img));
      }

      function openZone(file) {
        if (file.url.startsWith("http")) {
          window.open(file.url, "_blank");
          return;
        }
        currentZoneFile = file;
        const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
          if (zoneFrame && zoneFrame.parentNode) zoneViewer.removeChild(zoneFrame);
          zoneFrame = document.createElement("iframe");
          zoneFrame.id = "zoneFrame";
          zoneFrame.setAttribute("allow", "autoplay; keyboard; gamepad; fullscreen");
          zoneViewer.appendChild(zoneFrame);

          const preparedHtml = prepareZoneHtml(html);
          zoneFrame.contentDocument.open();
          zoneFrame.contentDocument.write(preparedHtml);
          zoneFrame.contentDocument.close();
          document.getElementById('zoneName').textContent = file.name;
          document.getElementById('zoneId').textContent = file.id;
          document.getElementById('zoneAuthor').textContent = "by " + (file.author || "gn-math");
          document.getElementById('zoneAuthor').href = file.authorLink || "#";
          viewerOpen = true;
          zoneViewer.style.display = "flex";
          requestAnimationFrame(() => {
            zoneViewer.classList.add('open');
            try { zoneFrame.focus(); } catch (e) {}
          });
        }).catch(error => alert("Failed to load zone: " + error));
      }

        if (currentZoneFile) openZone(currentZoneFile);

      function aboutBlank() {
        const newWindow = window.open("about:blank", "_blank");
        if (!newWindow) {
          alert("Please allow pop-ups for this site in your browser bar and try again.");
          return;

      /* ---------------- CALCULATOR ---------------- */
      let calcExpr = '';
      let calcLastResult = '0';
      let calcJustEvaluated = false;
      let calcAngleMode = 'DEG';
      let calcHistory = [];

      const calcExprEl = document.getElementById('calc-expr');
      const calcResultEl = document.getElementById('calc-result');
      const calcHistoryListEl = document.getElementById('calc-history-list');

      function updateCalcScreen() {
        calcExprEl.textContent = calcExpr;
        calcResultEl.textContent = calcLastResult;
      }

      function renderCalcHistory() {
        calcHistoryListEl.innerHTML = '';
        if (calcHistory.length === 0) {
          calcHistoryListEl.innerHTML = '<div class="meta-count">No calculations yet.</div>';
          return;
        }
        calcHistory.slice().reverse().forEach(entry => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'calc-history-item';
          const ex = document.createElement('span');
          ex.className = 'calc-history-expr';
          ex.textContent = entry.expr + ' =';
          const res = document.createElement('span');
          res.className = 'calc-history-val';
          res.textContent = entry.result;
          item.appendChild(ex);
          item.appendChild(res);
          item.addEventListener('click', () => {
            calcExpr = entry.result === 'Error' ? entry.expr : String(entry.result);
            calcLastResult = calcExpr;
            calcJustEvaluated = false;
            updateCalcScreen();
          });
          calcHistoryListEl.appendChild(item);
        });
      }

      function evaluateMathExpression(raw) {
        if (!raw || !raw.trim()) return 0;
        let normalized = raw
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/−/g, '-')
          .replace(/π/g, 'Math.PI')
          .replace(/\be\b/g, 'Math.E')
          .replace(/\^/g, '**')
          .replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

        const toRad = calcAngleMode === 'DEG' ? (x => (x * Math.PI) / 180) : (x => x);
        const sin = x => Math.sin(toRad(x));
        const cos = x => Math.cos(toRad(x));
        const tan = x => Math.tan(toRad(x));
        const log = x => Math.log10(x);
        const ln = x => Math.log(x);
        const sqrt = x => Math.sqrt(x);

        // Balance any unclosed parentheses cleanly
        const opens = (normalized.match(/\(/g) || []).length;
        const closes = (normalized.match(/\)/g) || []).length;
        if (opens > closes) normalized += ')'.repeat(opens - closes);

        const safeCharsCheck = normalized
          .replace(/Math\.(PI|E)/g, '')
          .replace(/\b(sin|cos|tan|log|ln|sqrt)\b/g, '');
        if (/[^0-9+\-*/().\s]/.test(safeCharsCheck)) {
          throw new Error('Invalid token');
        }

        const fn = new Function('sin', 'cos', 'tan', 'log', 'ln', 'sqrt', '"use strict"; return (' + normalized + ');');
        const value = fn(sin, cos, tan, log, ln, sqrt);
        if (typeof value !== 'number' || !Number.isFinite(value)) throw new Error('Math error');
        return Math.round(value * 1e12) / 1e12;
      }

      function handleCalcInput(val) {
        if (calcJustEvaluated) {
          if (/^[0-9.(πe]$/.test(val) || val.endsWith('(')) {
            calcExpr = val;
          } else {
            calcExpr = calcLastResult + val;
          }
          calcJustEvaluated = false;
        } else {
          calcExpr += val;
        }
        calcLastResult = calcExpr || '0';
        updateCalcScreen();
      }

      function handleCalcAction(action) {
        if (action === 'clear') {
          calcExpr = '';
          calcLastResult = '0';
          calcJustEvaluated = false;
          updateCalcScreen();
        } else if (action === 'backspace') {
          if (calcJustEvaluated) {
            calcExpr = '';
            calcLastResult = '0';
            calcJustEvaluated = false;
          } else {
            calcExpr = calcExpr.slice(0, -1);
            calcLastResult = calcExpr || '0';
          }
          updateCalcScreen();
        } else if (action === 'negate') {
          if (!calcExpr && calcLastResult !== '0' && calcLastResult !== 'Error') {
            calcExpr = calcLastResult;
          }
          if (calcExpr.startsWith('-')) calcExpr = calcExpr.slice(1);
          else if (calcExpr) calcExpr = '-' + calcExpr;
          calcLastResult = calcExpr || '0';
          calcJustEvaluated = false;
          updateCalcScreen();
        } else if (action === 'sq') {
          const target = calcExpr || calcLastResult;
          calcExpr = '(' + target + ')^2';
          handleCalcAction('equals');
        } else if (action === 'equals') {
          const exprToRun = calcExpr || calcLastResult;
          try {
            const val = evaluateMathExpression(exprToRun);
            const strVal = String(val);
            calcHistory.push({ expr: exprToRun, result: strVal });
            if (calcHistory.length > 40) calcHistory.shift();
            safeStorage.set(STORAGE_KEYS.calcHistory, JSON.stringify(calcHistory));
            renderCalcHistory();
            calcExprEl.textContent = exprToRun + ' =';
            calcLastResult = strVal;
            calcResultEl.textContent = strVal;
            calcExpr = strVal;
            calcJustEvaluated = true;
          } catch (e) {
            calcLastResult = 'Error';
            calcJustEvaluated = true;
            updateCalcScreen();
          }
        }
      }

      /* ---------------- NOTEPAD ---------------- */
      let notes = [];
      let activeNoteId = null;
      const notesListEl = document.getElementById('notes-list');
      const noteTitleInput = document.getElementById('note-title-input');
      const noteBodyInput = document.getElementById('note-body-input');
      const noteCountsEl = document.getElementById('note-counts');
      const noteSaveStatusEl = document.getElementById('note-save-status');

      function updateNoteCounts() {
        const text = noteBodyInput.value || '';
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        const chars = text.length;
        const lines = text ? text.split(/\r\n|\r|\n/).length : 0;
        noteCountsEl.textContent = `${words} ${words === 1 ? 'word' : 'words'} \u00B7 ${chars} ${chars === 1 ? 'character' : 'characters'} \u00B7 ${lines} ${lines === 1 ? 'line' : 'lines'}`;
      }

      function persistNotes() {
        safeStorage.set(STORAGE_KEYS.notes, JSON.stringify(notes));
        safeStorage.set(STORAGE_KEYS.activeNoteId, activeNoteId || '');
        noteSaveStatusEl.textContent = 'Saved locally';
      }

      function renderNotesList() {
        notesListEl.innerHTML = '';
        notes.forEach(note => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'note-item' + (note.id === activeNoteId ? ' active' : '');
          const t = document.createElement('span');
          t.className = 'note-item-title';

      /* ---------------- FOCUS TIMER (POMODORO + WEB AUDIO CHIME) ---------------- */
      const RING_CIRCUMFERENCE = 590.6;
      let timerTotalSec = 25 * 60;
      let timerRemainingSec = 25 * 60;
      let timerRunning = false;
      let timerInterval = null;
      let timerSoundEnabled = true;
      let sharedAudioCtx = null;

      const timerDisplayEl = document.getElementById('timer-display');
      const timerRingEl = document.getElementById('timer-ring-progress');
      const timerFeedbackEl = document.getElementById('timer-feedback');
      const railTimerBadge = document.getElementById('rail-timer-badge');
      const railTimerVal = document.getElementById('rail-timer-val');

      function formatMMSS(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function renderTimer() {
        const formatted = formatMMSS(timerRemainingSec);
        timerDisplayEl.textContent = formatted;
        railTimerVal.textContent = formatted;
        const ratio = timerTotalSec > 0 ? (1 - timerRemainingSec / timerTotalSec) : 0;
        timerRingEl.style.strokeDashoffset = String(RING_CIRCUMFERENCE * ratio);
        document.getElementById('timer-start-btn').disabled = timerRunning || timerRemainingSec <= 0;
        document.getElementById('timer-pause-btn').disabled = !timerRunning;
        railTimerBadge.classList.toggle('running', timerRunning);
      }

      function ensureAudioContext() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
          if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
          return sharedAudioCtx;
        } catch (e) {
          return null;
        }
      }

      function playSoftChime() {
        if (!timerSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;
        const notesHz = [523.25, 659.25, 783.99, 1046.5];
        const now = ctx.currentTime;
        notesHz.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.0001, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.16 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 0.95);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 1.0);
        });
      }

      function stopTimerInterval() {
        timerRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        renderTimer();
      }

      function setTimerDuration(minutes, seconds, label) {
        stopTimerInterval();
        const mins = Math.max(0, Math.min(180, parseInt(minutes, 10) || 0));
        const secs = Math.max(0, Math.min(59, parseInt(seconds, 10) || 0));
        const total = Math.max(1, mins * 60 + secs);
        timerTotalSec = total;
        timerRemainingSec = total;
        document.getElementById('timer-min-input').value = String(mins);
        document.getElementById('timer-sec-input').value = String(secs);
        if (label) document.getElementById('timer-mode-label').textContent = label;
        timerFeedbackEl.textContent = '';
        renderTimer();
      }

      function startTimer() {
        if (timerRunning || timerRemainingSec <= 0) return;
        ensureAudioContext();
        timerRunning = true;
        timerFeedbackEl.textContent = '';
        renderTimer();
        timerInterval = setInterval(() => {
          if (timerRemainingSec > 0) {
            timerRemainingSec--;
            renderTimer();
          }
          if (timerRemainingSec <= 0) {
            stopTimerInterval();
            timerFeedbackEl.textContent = 'Session complete.';
            playSoftChime();
          }
        }, 1000);
      }

      async function executeAiRequest(requestMessages) {
        hideAiError();
        aiLastRequestMessages = requestMessages.slice();
        aiAbortCtrl = new AbortController();
        setAiBusy(true);

        const modelMsg = { role: 'model', text: '' };
        aiMessages.push(modelMsg);
        renderAiMessages();

        const activeNote = notes.find(n => n.id === activeNoteId);
        const noteContext = aiIncludeNote && activeNote
          ? { title: activeNote.title, body: activeNote.body }
          : null;

        try {
          const endpoint = resolveAiApiBase() + '/api/ai/chat';
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: requestMessages,
              style: aiStyle,
              noteContext
            }),
            signal: aiAbortCtrl.signal
          });

          const contentType = res.headers.get('content-type') || '';
          if (!res.ok) {
            let errMsg = `Request failed (${res.status}).`;
            if (contentType.includes('application/json')) {
              const errData = await res.json().catch(() => null);
              if (errData && errData.error) errMsg = errData.error;
            } else if (res.status === 404 || res.status === 405) {
              errMsg = 'AI backend is unavailable from this static host. Launch via the app server to use live AI.';
            }
            throw new Error(errMsg);
          }

          if (contentType.includes('text/event-stream') && res.body) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';
              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed.startsWith('data:')) continue;
                const jsonStr = trimmed.slice(5).trim();
                if (!jsonStr) continue;
                let payload = null;
                try { payload = JSON.parse(jsonStr); } catch (e) {}
                if (!payload) continue;
                if (payload.error) throw new Error(payload.error);
                if (payload.chunk) {
                  modelMsg.text += payload.chunk;
                  renderAiMessages();
                }
              }
            }
          } else {
            const data = await res.json();
            if (data && data.error) throw new Error(data.error);
            modelMsg.text = (data && data.text) || '';
          }

          if (!modelMsg.text.trim()) {
            throw new Error('The AI returned an empty response. Please try again.');
          }

          persistAiState();
        } catch (err) {
          if (err && err.name === 'AbortError') {
            if (!modelMsg.text.trim()) aiMessages.pop();
            aiStatusEl.textContent = 'Stopped';
          } else {
            if (!modelMsg.text.trim()) aiMessages.pop();
            const msg = err && err.message && err.message.includes('Failed to fetch')
              ? 'Could not reach the AI server. Check your connection or ensure the app server is running.'
              : (err && err.message) || 'Failed to get AI response.';
            showAiError(msg);
          }
        } finally {
          aiAbortCtrl = null;
          setAiBusy(false);
          renderAiMessages();
        }
      }

      /* ---------------- DATA EXPORT / IMPORT / MODALS ---------------- */
      function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
        if (typeof obj === 'string') return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
        if (obj instanceof Uint8Array) return obj.length > maxArrayLen ? `[Uint8Array too large (${obj.length} bytes)]` : obj;
        if (Array.isArray(obj)) return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
        if (obj && typeof obj === 'object') {
          const out = {};
          for (const key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) out[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
          }
          return out;
        }
        return obj;
      }

      async function saveData() {
        const feedbackEl = document.getElementById('data-feedback');
        if (feedbackEl) feedbackEl.textContent = 'Preparing export...';
        const result = {
          cookies: '',
          localStorage: safeStorage.all(),
          sessionStorage: {},
          indexedDB: {},
          caches: {}
        };
        try { result.cookies = document.cookie; } catch (e) {}
        try { result.sessionStorage = { ...sessionStorage }; } catch (e) {}
        try {
          const dbs = await indexedDB.databases();
          for (const dbInfo of dbs) {
            if (!dbInfo.name) continue;
            result.indexedDB[dbInfo.name] = {};
            await new Promise((resolve, reject) => {
              const req = indexedDB.open(dbInfo.name, dbInfo.version);
              req.onerror = () => reject(req.error);
              req.onsuccess = () => {
                const db = req.result;
                const stores = Array.from(db.objectStoreNames);
                if (stores.length === 0) { resolve(); return; }
                const tx = db.transaction(stores, 'readonly');
                Promise.all(stores.map(storeName => new Promise((res, rej) => {
                  const getAll = tx.objectStore(storeName).getAll();
                  getAll.onsuccess = () => {
                    result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAll.result, 1000, 100);
                    res();
                  };
                  getAll.onerror = () => rej(getAll.error);
                }))).then(resolve);
              };
            });
          }
        } catch (e) {}

        const link = document.createElement('a');
        const blobUrl = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: 'application/json' }));
        link.href = blobUrl;
        link.download = `workspace-backup-${Date.now()}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
        if (feedbackEl) feedbackEl.textContent = 'Workspace data exported.';
      }

        };
        reader.readAsText(file);
      }

        calcAngleMode = calcAngleMode === 'DEG' ? 'RAD' : 'DEG';
        e.target.textContent = calcAngleMode;
      });
      document.querySelectorAll('[data-calc-val]').forEach(btn => {
        btn.addEventListener('click', () => handleCalcInput(btn.getAttribute('data-calc-val')));
      });
      document.querySelectorAll('[data-calc-action]').forEach(btn => {
        btn.addEventListener('click', () => handleCalcAction(btn.getAttribute('data-calc-action')));
      });
      document.getElementById('calc-clear-history').addEventListener('click', () => {
        calcHistory = [];
        safeStorage.set(STORAGE_KEYS.calcHistory, '[]');
        renderCalcHistory();
      });

      document.addEventListener('keydown', e => {
        if (activeApp !== 'calculator' || viewerOpen) return;
        const tag = (document.activeElement?.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (/^[0-9.()+\-*/%^]$/.test(e.key)) {
          e.preventDefault();
          const mapped = e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key;
          handleCalcInput(mapped);
        } else if (e.key === 'Enter' || e.key === '=') {
          e.preventDefault();
          handleCalcAction('equals');
        } else if (e.key === 'Backspace') {
          e.preventDefault();
          handleCalcAction('backspace');
        } else if (e.key === 'Escape' || e.key === 'Delete') {
          e.preventDefault();
          handleCalcAction('clear');
        }
      });

      // Notepad Events
      document.getElementById('note-new-btn').addEventListener('click', createNewNote);
      noteTitleInput.addEventListener('input', () => {
        const note = notes.find(n => n.id === activeNoteId);
        if (!note) return;
        note.title = noteTitleInput.value;
        persistNotes();
        renderNotesList();
      });
      noteBodyInput.addEventListener('input', () => {
        const note = notes.find(n => n.id === activeNoteId);
        if (!note) return;
        note.body = noteBodyInput.value;
        updateNoteCounts();
        persistNotes();
        renderNotesList();
      });
      document.getElementById('note-download-btn').addEventListener('click', () => {
        const title = (noteTitleInput.value || 'note').trim().replace(/[^a-z0-9_\- ]/gi, '_') || 'note';
        const blob = new Blob([noteBodyInput.value], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        noteSaveStatusEl.textContent = 'Downloaded .txt';
      });
      document.getElementById('note-copy-btn').addEventListener('click', async () => {
        const text = noteBodyInput.value || '';
        let copied = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch (err) {}
        if (!copied) {
          noteBodyInput.select();
          try { copied = document.execCommand('copy'); } catch (err) {}
          try { noteBodyInput.setSelectionRange(0, 0); noteBodyInput.blur(); } catch (err) {}
        }
        noteSaveStatusEl.textContent = copied ? 'Copied all text' : 'Select text to copy';
      });
      document.getElementById('note-delete-btn').addEventListener('click', () => {
        if (notes.length <= 1) {
          notes[0].title = 'Quick Scratchpad';
          notes[0].body = '';
          persistNotes();
          selectNote(notes[0].id);
          return;
        }
        notes = notes.filter(n => n.id !== activeNoteId);
        persistNotes();
        selectNote(notes[0].id);
      });

      // Focus Timer Events
      document.querySelectorAll('[data-timer-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-timer-preset]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          setTimerDuration(btn.getAttribute('data-timer-preset'), 0, btn.getAttribute('data-timer-label'));
        });
      });
      document.getElementById('timer-apply-custom-btn').addEventListener('click', () => {
        document.querySelectorAll('[data-timer-preset]').forEach(b => b.classList.remove('active'));
        setTimerDuration(document.getElementById('timer-min-input').value, document.getElementById('timer-sec-input').value, 'Custom Timer');
      });
      document.getElementById('timer-start-btn').addEventListener('click', startTimer);
      document.getElementById('timer-pause-btn').addEventListener('click', stopTimerInterval);
      document.getElementById('timer-reset-btn').addEventListener('click', () => {
        stopTimerInterval();
        timerRemainingSec = timerTotalSec;
        timerFeedbackEl.textContent = '';
        renderTimer();
      });
      document.getElementById('timer-test-chime-btn').addEventListener('click', () => {
        playSoftChime();
        timerFeedbackEl.textContent = 'Chime played.';
      });
      document.getElementById('timer-sound-switch').addEventListener('click', e => {
        timerSoundEnabled = !timerSoundEnabled;
        e.currentTarget.setAttribute('aria-checked', String(timerSoundEnabled));
      });

      // Settings Events
      document.querySelectorAll('[data-theme-preset]').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.getAttribute('data-theme-preset'), true));
      });
      document.getElementById('accent-color-picker').addEventListener('input', e => {
        setAccentColor(e.target.value);
      });
      document.getElementById('reset-accent-btn').addEventListener('click', () => {
        setAccentColor(THEME_DEFAULTS[currentTheme]);
      });
      document.getElementById('font-family-select').addEventListener('change', e => {
        setFont(e.target.value);
      });
      document.getElementById('save-brand-btn').addEventListener('click', () => {
        const nextBrand = document.getElementById('brand-name-input').value.trim() || 'Dashboard';
        document.getElementById('portal-brand').textContent = nextBrand;
        safeStorage.set(STORAGE_KEYS.brand, nextBrand);
      });
      document.querySelectorAll('[data-cloak-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          const preset = CLOAK_PRESETS[btn.getAttribute('data-cloak-preset')];
          if (!preset) return;
          document.querySelectorAll('[data-cloak-preset]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyCloak(preset.title, preset.icon);
          document.getElementById('cloak-feedback').textContent = `Tab cloaked as "${preset.title}".`;
        });
      });
      document.getElementById('cloak-title-input').addEventListener('input', e => {
        applyCloak(e.target.value, safeStorage.get(STORAGE_KEYS.cloakIcon, DEFAULT_FAVICON));
      });
      document.getElementById('apply-cloak-btn').addEventListener('click', () => {
        applyCloak(document.getElementById('cloak-title-input').value, document.getElementById('cloak-icon-input').value);
        document.getElementById('cloak-feedback').textContent = 'Custom tab cloak applied.';
      });
      document.getElementById('reset-cloak-btn').addEventListener('click', () => {
        document.querySelectorAll('[data-cloak-preset]').forEach(b => b.classList.remove('active'));
        applyCloak('Dashboard', DEFAULT_FAVICON);
        document.getElementById('cloak-feedback').textContent = 'Restored default Dashboard title and icon.';
      });
      document.getElementById('fps-switch').addEventListener('click', () => setUnlimitedFps(!unlimitedFps));
      document.getElementById('compact-switch').addEventListener('click', () => setCompact(!container.classList.contains('compact')));
      document.getElementById('motion-switch').addEventListener('click', () => setNoMotion(!document.body.classList.contains('no-motion')));
      document.getElementById('clear-favs-btn').addEventListener('click', () => {
        favorites = [];
        safeStorage.set(STORAGE_KEYS.favs, '[]');
        renderActiveList();
        document.getElementById('data-feedback').textContent = 'Favorites cleared.';
      });

      // AI Assistant Events
      document.querySelectorAll('[data-ai-style]').forEach(btn => {
        btn.addEventListener('click', () => setAiStyle(btn.getAttribute('data-ai-style')));
      });
      aiIncludeNoteBtn.addEventListener('click', () => {
        aiIncludeNote = !aiIncludeNote;
        aiIncludeNoteBtn.classList.toggle('active', aiIncludeNote);
        aiIncludeNoteBtn.setAttribute('aria-pressed', String(aiIncludeNote));
      });
      document.getElementById('ai-clear-btn').addEventListener('click', () => {
        if (aiAbortCtrl) aiAbortCtrl.abort();
        aiMessages = [];
        aiLastRequestMessages = null;
        hideAiError();
        persistAiState();
        renderAiMessages();
      });
      document.getElementById('ai-retry-btn').addEventListener('click', () => {
        if (aiStreaming || !aiLastRequestMessages || aiLastRequestMessages.length === 0) return;
        executeAiRequest(aiLastRequestMessages);
      });
      document.getElementById('ai-composer-form').addEventListener('submit', e => {
        e.preventDefault();
        sendAiPrompt();
      });
      aiPromptInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendAiPrompt();
        }
      });

      loadPreferences();
      loadNotes();
      loadAiState();
      renderCalcHistory();
      renderTimer();
      listZones();
    </script>
  </template>

  <script>
    (function () {
      var activePopup = null;

      document.addEventListener("click", function () {
        if (activePopup && !activePopup.closed) {
          activePopup.focus();
          return;
        }

        var templateEl = document.getElementById("portal-template");
        var apiOrigin = (
          window.location.origin &&
          window.location.origin !== "null" &&
          window.location.protocol.indexOf("http") === 0
        ) ? window.location.origin : "";
        var originScript = "<script>window.__PORTAL_ORIGIN__=" + JSON.stringify(apiOrigin) + ";<\/script>\n";
        var htmlContent = "<!DOCTYPE html>\n<html lang=\"en\">\n" + originScript + templateEl.innerHTML + "\n<\/html>";
        var blob = new Blob([htmlContent], { type: "text/html" });
        var blobUrl = URL.createObjectURL(blob);
        var popup = window.open(
          blobUrl,
          "_blank",
          "width=920,height=650,menubar=no,toolbar=no,location=no,status=no"
        );

        if (!popup || popup.closed || typeof popup.closed === "undefined") {
          URL.revokeObjectURL(blobUrl);
          alert("Please allow pop-ups for this site in your browser bar and click again.");
          return;
        }

        activePopup = popup;
        setTimeout(function () {
          URL.revokeObjectURL(blobUrl);
        }, 60000);
      });
    })();
  </script>
</body>
</html>
