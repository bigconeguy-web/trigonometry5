  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>
    (function () {
      try {
        if (typeof navigator !== "undefined" && "serviceWorker" in navigator && typeof navigator.serviceWorker.getRegistrations === "function") {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (!Array.isArray(registrations)) return;
            var scramScope = window.location.origin + "/scram/";
            for (var i = 0; i < registrations.length; i++) {
              try {
                if (registrations[i] && registrations[i].scope !== scramScope) {
                  registrations[i].unregister();
                }
              } catch (_err) {}
            }
          }).catch(function () {});
        }
      } catch (_err) {}
    })();
  </script>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>

</body>
